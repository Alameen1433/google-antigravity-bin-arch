name: Create GitHub Release on main

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update Google Antigravity PKGBUILD
    types:
      - completed

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from PKGBUILD
        id: version
        run: |
          VERSION=$(grep '^pkgver=' package/PKGBUILD | cut -d'=' -f2 | tr -d '[:space:]')

          if [ -z "$VERSION" ]; then
            echo "Could not determine version from package/PKGBUILD"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: release_exists
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.version.outputs.tag }}';
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Determine target commit
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.release_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.target.outputs.sha }}
          generate_release_notes: true
          body: |
            Automated release created after merge/push to main.
            Package version: `${{ steps.version.outputs.version }}`.

      - name: Release already exists
        if: steps.release_exists.outputs.exists == 'true'
        run: echo "Release ${{ steps.version.outputs.tag }} already exists. Skipping."
